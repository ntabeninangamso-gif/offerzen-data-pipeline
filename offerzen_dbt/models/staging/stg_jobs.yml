version: 2
sources:
  - name: raw
    database: offerzen_db
    schema: public
    description: "Raw job data ingested from the OfferZen API and historical CSV files."
    tables:
      - name: jobs_current_raw
        description: "Raw dataset containing currently active job postings from the OfferZen API."
        columns:
          - name: job_id
            description: "Unique identifier for the job posting."
            tests:
              - not_null
              - unique
          - name: internal_job_id
            description: "Internal OfferZen job identifier used for tracking job postings."
          - name: title
            description: "Title of the job posting."
          - name: absolute_url

            description: "URL linking to the job listing."

          - name: location

            description: "Location where the job is based."

          - name: company_name

            description: "Name of the company offering the job."

          - name: first_published

            description: "Timestamp indicating when the job was first published."

          - name: updated_at

            description: "Timestamp indicating when the job listing was last updated."

          - name: language

            description: "Primary programming language associated with the job role."

      - name: jobs_history_raw

        description: "Historical dataset containing past job postings."

        columns:

          - name: job_id

            description: "Unique identifier for the job posting."

            tests:

              - not_null

          - name: internal_job_id

            description: "Internal OfferZen job identifier."

          - name: title

            description: "Title of the job posting."

          - name: department

            description: "Department associated with the job."

          - name: location

            description: "Location where the job was posted."

          - name: company_name

            description: "Company that posted the job."

          - name: open_date

            description: "Date when the job opening started."

          - name: close_date

            description: "Date when the job posting was closed."

models:

  - name: stg_jobs_current

    description: "Staging model that cleans and standardizes the current jobs dataset."

    columns:

      - name: job_id

        description: "Unique job identifier from the source system."

        tests:

          - not_null

          - unique

      - name: internal_job_id

        description: "Internal OfferZen job identifier."

      - name: title

        description: "Cleaned and normalized job title."

      - name: location

        description: "Standardized job location."

      - name: company_name

        description: "Standardized company name."

      - name: first_published

        description: "Timestamp indicating when the job was first published."

      - name: updated_at

        description: "Timestamp indicating when the job was last updated."


  - name: stg_jobs_history

    description: "Staging model that cleans and standardizes historical job postings."

    columns:

      - name: job_id

        description: "Unique identifier for the job posting."

      - name: internal_job_id

        description: "Internal OfferZen job identifier."

      - name: title

        description: "Normalized job title."

      - name: department

        description: "Department associated with the job."

      - name: location

        description: "Standardized job location."

      - name: company_name

        description: "Standardized company name."

      - name: open_date

        description: "Date when the job was opened."

      - name: close_date

        description: "Date when the job was closed."


  - name: stg_fact_jobs

    description: "Staging model that combines current and historical job datasets for building the fact table."

    columns:

      - name: job_id

        description: "Unique identifier for the job posting."

        tests:

          - not_null

      - name: internal_job_id

        description: "Internal OfferZen job identifier."

      - name: title

        description: "Normalized job title."

      - name: department

        description: "Department associated with the job."

      - name: location

        description: "Job location."

      - name: company_name

        description: "Company offering the job."

      - name: open_date

        description: "Date when the job opened."

      - name: close_date

        description: "Date when the job closed."

      - name: first_published

        description: "Timestamp when the job was first published."

      - name: updated_at

        description: "Timestamp when the job listing was last updated."

      - name: is_current

        description: "Indicator showing whether the job is currently active (1) or historical (0)."
 